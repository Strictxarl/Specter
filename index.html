    <style>

<body class="antialiased">

    <div id="root"></div>

    <script>
    (function(){
        
        const SVG = {
            Menu: `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" x2="20" y1="12" y2="12"></line><line x1="4" x2="20" y1="6" y2="6"></line><line x1="4" x2="20" y1="18" y2="18"></line></svg>`,
            X: `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>`,
            Sun: `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>`,
            Moon: `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>`,
            Play: `<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"/></svg>`,

        };

        // --- Data ---
        const PROJECTS_DATA = [
            { id:1, title:"Real-time Analytics Dashboard", description:"A high-speed, interactive dashboard built using websockets and charts to visualize live data streams. Features dynamic scaling and customizable widget layouts.", tags: ['React','WebSockets','Tailwind CSS','Performance'] },
            { id:2, title:"Modular Design System (MDS)", description:"Company-wide design system with 50+ reusable components, Storybook-driven docs, and atomic patterns to speed development.", tags: ['TypeScript','React','Storybook','Atomic Design'] },

        // --- utility for element creation from html ---
        function htmlToElement(html){
            const template = document.createElement('template');
            template.innerHTML = html.trim();
            return template.content.firstChild;
        }

        // --- Preloader (typing lines) ---
        function createPreloader(doneCb){
            const lines = [
            "// Initializing Front-End Core...",
            "// Dependency Check: React, TailwindCSS, JS - [PASS]",
            "// Loading SPECTER Data Schema...",
            "// Deploying Portfolio UI: engage animation."
            ];
            const overlay = document.createElement('div');
            // ensure fixed full-screen and prevent background scroll while visible
            overlay.className = "fixed inset-0 z-[100] flex items-center justify-center bg-specter-dark transition-opacity duration-700 ease-out";
            overlay.innerHTML = `
            <div class="font-mono text-specter-neon p-4 sm:p-6 rounded-lg shadow-xl shadow-specter-neon/20 max-w-[92vw] sm:max-w-md w-full max-h-[86vh] overflow-auto">
                <h1 class="text-lg sm:text-xl mb-4 sm:mb-6 text-specter-neon font-display tracking-widest animate-pulse">SPECTER PORTFOLIO</h1>
                <pre class="text-left" id="pre-lines"></pre>
            </div>
            `;
            // hide body scroll while preloader is active
            const prevOverflow = document.body.style.overflow;
            document.body.style.overflow = 'hidden';
            document.body.appendChild(overlay);
            const pre = overlay.querySelector('#pre-lines');
            // make pre wrapping / scroll-friendly on small screens
            pre.className = "text-sm sm:text-base whitespace-pre-wrap break-words max-h-[46vh] sm:max-h-[36vh] overflow-y-auto pr-2";
            let i = 0;
            function step(){
            if(i < lines.length){
                const lineWrap = document.createElement('div');
                const code = document.createElement('code');
                // typing-line kept but allow wrapping and avoid huge widths
                code.className = "block typing-line";
                code.textContent = lines[i];
                lineWrap.appendChild(code);
                pre.appendChild(lineWrap);
                // keep pre scrolled to bottom as new lines are added
                pre.scrollTop = pre.scrollHeight;
                // force reflow then animate
                requestAnimationFrame(()=> code.classList.add('animate'));
                i++;
                setTimeout(step, 1500);
            } else {
                setTimeout(()=> {
                overlay.remove();
                document.body.style.overflow = prevOverflow || '';
                doneCb();
                }, 900);
            }
            }
            step();
        }

        // --- Scroll reveal using IntersectionObserver ---
        function initScrollReveal(){
            const obs = new IntersectionObserver((entries)=>{
                entries.forEach(en=>{
                    if(en.isIntersecting){
                        en.target.classList.add('reveal-show');
                        obs.unobserve(en.target);
                    }
                });
            }, { threshold: 0.12 });
            document.querySelectorAll('[data-reveal]').forEach(el=>{
                el.classList.add('reveal-init');
                obs.observe(el);
            });
        }

        // --- Modal system ---
        function openProjectModal(project){
            const overlay = document.createElement('div');
            overlay.className = "fixed inset-0 z-[90] flex items-center justify-center p-4";
            overlay.innerHTML = `
                <div class="absolute inset-0 bg-specter-dark/90 dark:bg-specter-dark/95 backdrop-blur-sm transition-opacity duration-300"></div>
                <div class="relative w-full max-w-5xl h-[80vh] rounded-xl overflow-hidden shadow-2xl transition-all duration-300 transform scale-100 bg-specter-card border border-specter-neon/50">
                    <div class="p-4 flex justify-between items-center border-b border-specter-neon/30">
                        <div class="flex items-center space-x-3">
                            <div class="w-8 h-8 text-specter-neon">🔎</div>
                            <h2 class="text-xl font-display font-bold text-specter-neon">${project.title} <span class="text-sm font-mono text-specter-secondary">(LIVE SIMULATION)</span></h2>
                        </div>
                        <button class="p-2 rounded-full text-specter-neon hover:bg-specter-neon/10 transition modal-close">${SVG.X}</button>
                    </div>
                    <div class="h-[calc(100%-60px)] overflow-y-auto p-4 modal-body"></div>
                </div>
            `;
            document.body.appendChild(overlay);
            overlay.querySelector('.modal-close').addEventListener('click', ()=> overlay.remove());
            overlay.addEventListener('click', (e)=> { if(e.target===overlay) overlay.remove(); });
            // fill demo content per project id
            const body = overlay.querySelector('.modal-body');
            if(project.id === 1){
                body.appendChild(renderAnalyticsDemo());
            } else if(project.id === 2){
                body.appendChild(renderDesignDemo());
            } else if(project.id === 3){
                body.appendChild(renderEcommerceDemo());
            } else {
                body.innerHTML = `<p class="p-4">Simulated demo environment for ${project.title}.</p>`;
            }
        }

        // --- Demo renderers (simple DOM) ---
        function renderAnalyticsDemo(){
            const container = document.createElement('div');
            container.className = "p-6 grid grid-cols-1 lg:grid-cols-3 gap-6 font-mono";
            // small stats
            const data = [8,12,6,15,10,18,14];
            const totalViews = data.reduce((a,b)=>a+b,0);
            const growth = ((data[data.length-1]-data[0])/data[0])*100;
            container.innerHTML = `
                <div class="lg:col-span-3"><h3 class="text-lg font-display text-specter-secondary mb-4">Live Traffic & Engagement Metrics</h3></div>
                <div class="p-4 rounded-lg bg-specter-dark/50 border border-specter-neon/30">
                    <p class="text-sm text-specter-text-dark">Total Views (7s)</p>
                    <p class="text-3xl font-bold text-specter-neon mt-1">${totalViews}k</p>
                </div>
                <div class="p-4 rounded-lg bg-specter-dark/50 border border-specter-neon/30">
                    <p class="text-sm text-specter-text-dark">Engagement Rate</p>
                    <p class="text-3xl font-bold text-specter-neon mt-1">${Math.round(Math.random()*5+5)}%</p>
                </div>
                <div class="p-4 rounded-lg bg-specter-dark/50 border border-specter-neon/30">
                    <p class="text-sm text-specter-text-dark">Growth</p>
                    <p class="text-3xl font-bold mt-1 ${growth>=0 ? 'text-green-400' : 'text-specter-secondary'}">${growth.toFixed(2)}%</p>
                </div>
                <div class="lg:col-span-3 p-6 rounded-lg bg-specter-dark/50 border border-specter-neon/30">
                    <h4 class="font-display text-specter-neon mb-4">Traffic Stream (Per Second)</h4>
                    <div class="flex items-end h-64 border-b border-l border-specter-neon/50 pr-2" id="bar-wrap"></div>
                    <p class="text-xs text-center text-specter-text-dark mt-2">Time (T-7s to T-0s)</p>
                </div>
            `;
            // bars
            const barWrap = container.querySelector('#bar-wrap');
            data.forEach((val,idx)=>{
                const bar = document.createElement('div');
                bar.title = `${val}k`;
                bar.style.height = `${val*4}px`;
                bar.className = `w-1/4 mx-1 ${idx===data.length-1? 'bg-specter-secondary' : 'bg-specter-neon/60'} rounded-t-sm transition-all duration-1000 ease-linear`;
                barWrap.appendChild(bar);
            });
            // animate random updates
            setInterval(()=>{
                const all = barWrap.children;
                for(let i=0;i<all.length-1;i++){
                    all[i].style.height = `${(Math.floor(Math.random()*14)+6)*4}px`;
                }
            }, 2000);
            return container;
        }

        function renderDesignDemo(){
            const container = document.createElement('div');

            container.innerHTML = `

                    <div id="mds-tabs"></div>

                <div class="col-span-3 p-6 dark:bg-specter-dark/30">
                    <h4 class="text-xl font-display text-specter-secondary mb-6" id="mds-title">Buttons Components</h4>

        // --- Contact form handling ---
        function initContactForm(formEl){
            if(!formEl) return;
            let statusEl = formEl.querySelector('#status-msg');
            if(!statusEl){
                statusEl = document.createElement('div');
                statusEl.id = 'status-msg';
                formEl.prepend(statusEl);
            }
            formEl.addEventListener('submit', async (e)=>{
                e.preventDefault();
                const formData = new FormData(formEl);
                const email = formData.get('email') || '';
                const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                if(!emailRegex.test(email)){
                    statusEl.textContent = "ERROR: Invalid email syntax. Check your input.";
                    statusEl.className = 'p-3 rounded-lg border font-mono text-sm bg-red-900/50 text-red-400 border-red-500';
                    return;
                }
                statusEl.textContent = "PROCESSING: Sending message...";
                statusEl.className = 'p-3 rounded-lg border font-mono text-sm bg-blue-900/50 text-blue-400 border-blue-500';
                const btn = formEl.querySelector('button[type="submit"]');
                if(btn) btn.disabled = true;
                try {
                    const res = await fetch(formEl.action, {
                        method: formEl.method || 'POST',
                        headers: { 'Accept': 'application/json' },
                        body: formData
                    });
                    if(res.ok){
                        statusEl.textContent = "SUCCESS: Message transmitted. Specter will respond ASAP.";
                        statusEl.className = 'p-3 rounded-lg border font-mono text-sm bg-green-900/50 text-green-400 border-green-500';
                        formEl.reset();
                    } else {
                        const data = await res.json().catch(()=>null);
                        const msg = (data && (data.error || data.message)) ? (data.error || data.message) : 'Server error. Please try again later.';
                        statusEl.textContent = `ERROR: ${msg}`;
                        statusEl.className = 'p-3 rounded-lg border font-mono text-sm bg-red-900/50 text-red-400 border-red-500';
                    }
                } catch(err){
                    statusEl.textContent = "ERROR: Network error. Please check your connection.";
                    statusEl.className = 'p-3 rounded-lg border font-mono text-sm bg-red-900/50 text-red-400 border-red-500';
                } finally {
                    if(btn) btn.disabled = false;
                }
            });
        }

                        </section>

                        <section id="about" class="py-20">
                            <h2 class="text-4xl font-display font-bold text-center mb-16"><span class="text-specter-neon">// EXPERTISE</span></h2>
                            <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
                                <div class="p-6 rounded-xl border border-specter-neon/30 dark:bg-specter-card bg-specter-light shadow-xl" data-reveal>
                                    <div class="flex items-center space-x-3 mb-4"><div class="w-6 h-6 text-specter-secondary">⚡</div><h3 class="text-xl font-display font-bold text-specter-neon">React & SPA Architecture</h3></div>
                                    <p class="text-sm text-specter-text-dark">Building modular, reusable components and managing complex application state using modern patterns (Hooks, Context, Zustand).</p>
                                </div>
                                <div class="p-6 rounded-xl border border-specter-neon/30 dark:bg-specter-card bg-specter-light shadow-xl" data-reveal>
                                    <div class="flex items-center space-x-3 mb-4"><div class="w-6 h-6 text-specter-secondary">⚡</div><h3 class="text-xl font-display font-bold text-specter-neon">Performance & Optimization</h3></div>
                                    <p class="text-sm text-specter-text-dark">Focused on Core Web Vitals, lazy loading, code splitting, and memoization to ensure lightning-fast load times and smooth user experience.</p>
                                </div>
                                <div class="p-6 rounded-xl border border-specter-neon/30 dark:bg-specter-card bg-specter-light shadow-xl" data-reveal>
                                    <div class="flex items-center space-x-3 mb-4"><div class="w-6 h-6 text-specter-secondary">🎨</div><h3 class="text-xl font-display font-bold text-specter-neon">Atomic UI/UX Design</h3></div>
                                    <p class="text-sm text-specter-text-dark">Translating Figma designs into responsive, cross-browser, and accessible interfaces, utilizing Tailwind CSS for utility-first styling.</p>
                                </div>
                            </div>
                        </section>

                        <section id="stack" class="py-20">
                            <h2 class="text-4xl font-display font-bold text-center mb-16"><span class="text-specter-neon">// DEV STACK</span></h2>
                            <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-8 text-center" id="tech-grid"></div>
                        </section>

                        <section id="projects" class="py-20">
                            <h2 class="text-4xl font-display font-bold text-center mb-16"><span class="text-specter-neon">// PROJECTS</span></h2>
                            <div class="space-y-12" id="projects-list"></div>
                        </section>

                        <section id="contact" class="py-20">
                            <h2 class="text-4xl font-display font-bold text-center mb-16"><span class="text-specter-neon">// HIRE SPECTER</span></h2>
                            <div class="max-w-xl mx-auto p-8 rounded-xl border border-specter-secondary/30 dark:bg-specter-card bg-white shadow-2xl">
                                <p class="text-center font-sans mb-6 text-specter-text-dark">If you need a reliable, high-performing frontend developer, I'm ready for the deployment.</p>
                                <form action="https://formspree.io/f/xkgkwyld" method="POST" id="contact-form" class="space-y-4">
                                    <div id="status-msg"></div>
                                    <div>
                                        <label class="block text-sm font-mono mb-1">Name</label>
                                        <input name="name" required class="w-full px-4 py-3 font-mono rounded-lg border focus:ring-2 focus:ring-specter-neon focus:border-specter-neon bg-specter-dark border-specter-secondary/50 text-specter-neon"/>
                                    </div>
                                    <div>
                                        <label class="block text-sm font-mono mb-1">Email</label>
                                        <input name="email" type="email" required class="w-full px-4 py-3 font-mono rounded-lg border focus:ring-2 focus:ring-specter-neon focus:border-specter-neon bg-specter-dark border-specter-secondary/50 text-specter-neon" placeholder="email@example.com"/>
                                    </div>
                                    <div>
                                        <label class="block text-sm font-mono mb-1">Message</label>
                                        <textarea name="message" rows="4" required class="w-full px-4 py-3 font-mono rounded-lg border focus:ring-2 focus:ring-specter-neon focus:border-specter-neon bg-specter-dark border-specter-secondary/50 text-specter-neon"></textarea>
                                    </div>
                                    <button type="submit" class="w-full px-4 py-3 font-mono font-bold rounded-lg text-specter-dark bg-specter-secondary shadow-xl hover:bg-white transition"> // EXECUTE_TRANSMISSION()</button>
                                </form>
                            </div>
                        </section>
                    </main>

                    <footer class="py-8 mt-12 text-center dark:bg-specter-card bg-gray-100 border-t dark:border-specter-neon/10 border-gray-300">
                        <p class="text-sm font-mono dark:text-specter-text-dark text-gray-600">// 2024 SPECTER. Built with Vanilla JS &amp; Tailwind.</p>
                    </footer>
                </div>
            `;
            // normalize project tags: remove Next.js / Redux/Zustand / Figma and add JavaScript, HTML, CSS where appropriate
            PROJECTS_DATA.forEach(p => {
                const banned = ['Next.js', 'Redux/Zustand', 'Figma'];
                const hasBanned = p.tags.some(t => banned.includes(t));
                if (hasBanned) {
                    // remove banned tags and ensure JS/HTML/CSS exist
                    p.tags = p.tags.filter(t => !banned.includes(t));
                    ['JavaScript','HTML','CSS'].forEach(t => { if (!p.tags.includes(t)) p.tags.push(t); });
                }
            });

            // Watch the tech grid and replace unwanted tech entries with JavaScript / HTML / CSS
            const replacements = {
                'Redux/Zustand': { name: 'JavaScript', color: 'text-yellow-300', icon: '🟨' },
                'Next.js':       { name: 'HTML',       color: 'text-orange-400', icon: '📄' },
                'Figma':         { name: 'CSS',        color: 'text-blue-400',   icon: '🎨' },
            };

            const techGridObserver = new MutationObserver((mutations, obs) => {
                const grid = document.getElementById('tech-grid');
                if (!grid) return;
                const children = Array.from(grid.children);
                let mutated = false;
                children.forEach(child => {
                    const span = child.querySelector('span');
                    if (!span) return;
                    const label = span.textContent.trim();
                    if (replacements[label]) {
                        const r = replacements[label];
                        child.innerHTML = `<p class="text-4xl mb-2">${r.icon}</p><span class="font-mono font-semibold text-sm ${r.color}">${r.name}</span>`;
                        mutated = true;
                    }
                });
                if (mutated) obs.disconnect();
            });

            // start observing; when techs are appended the observer will update them
            const existingGrid = document.getElementById('tech-grid');
            if (existingGrid && existingGrid.children.length) {
                // already populated - run immediately
                techGridObserver.takeRecords();
                techGridObserver.disconnect();
                const children = Array.from(existingGrid.children);
                children.forEach(child => {
                    const span = child.querySelector('span');
                    if (!span) return;
                    const label = span.textContent.trim();
                    if (replacements[label]) {
                        const r = replacements[label];
                        child.innerHTML = `<p class="text-4xl mb-2">${r.icon}</p><span class="font-mono font-semibold text-sm ${r.color}">${r.name}</span>`;
                    }
                });
            } else {
                techGridObserver.observe(document.getElementById('tech-grid') || document.body, { childList: true, subtree: true });
            }
            // populate tech grid
            const techs = [
                { name: 'React', color: 'text-specter-neon', icon: '⚛️' },
                { name: 'TypeScript', color: 'text-blue-500', icon: '🟦' },
                { name: 'Tailwind CSS', color: 'text-cyan-400', icon: '🌬️' },
                { name: 'Next.js', color: 'text-gray-400', icon: '🚀' },
                { name: 'Redux/Zustand', color: 'text-purple-500', icon: '🧠' },
                { name: 'Figma', color: 'text-red-500', icon: '📐' },
            ];
            const techGrid = document.getElementById('tech-grid');
            techs.forEach((t,idx)=>{
                const item = document.createElement('div');
                item.className = "p-4 rounded-xl dark:bg-specter-card bg-white shadow-lg hover:shadow-specter-secondary/30 transform hover:scale-110 transition duration-300";
                item.setAttribute('data-reveal','');
                item.innerHTML = `<p class="text-4xl mb-2">${t.icon}</p><span class="font-mono font-semibold text-sm ${t.color}">${t.name}</span>`;
                techGrid.appendChild(item);
            });

            // populate projects
            const list = document.getElementById('projects-list');
            PROJECTS_DATA.forEach((p,idx)=>{
                const el = document.createElement('div');
                el.className = "flex flex-col md:flex-row p-6 md:p-8 rounded-xl border border-specter-secondary/20 dark:bg-specter-card bg-white shadow-xl hover:shadow-specter-neon/30 transition duration-300";
                el.setAttribute('data-reveal','');
                el.innerHTML = `
                    <div class="md:w-3/4">
                        <h3 class="text-2xl font-display font-bold text-specter-neon mb-2">${p.title}</h3>
                        <p class="font-sans dark:text-specter-text-dark text-gray-700 mb-4">${p.description}</p>
                        <div class="flex flex-wrap gap-2">${p.tags.map(tag=>`<span class="px-3 py-1 text-xs font-mono rounded-full bg-specter-secondary/20 text-specter-secondary">${tag}</span>`).join('')}</div>
                    </div>
                    <div class="md:w-1/4 flex justify-end items-start pt-4 md:pt-0">
                        <button class="flex items-center text-specter-neon font-mono hover:text-specter-secondary transition duration-200 demo-btn" data-id="${p.id}">View Demo ${SVG.Play}</button>
                    </div>
                `;
                list.appendChild(el);
            });

            // init reveals
            initScrollReveal();

            // mobile menu toggle
            const mobileBtn = document.getElementById('mobile-menu-btn');
            const mobileMenu = document.getElementById('mobile-menu');
            mobileBtn.addEventListener('click', ()=> {
                const open = !mobileMenu.classList.contains('hidden');
                mobileMenu.classList.toggle('hidden', open);
                mobileBtn.innerHTML = open ? SVG.Menu : SVG.X;
            });

            // theme toggle
            const themeToggle = document.getElementById('theme-toggle');
            const docRoot = document.documentElement;
            let isDark = localStorage.getItem('theme') === 'dark' || (!localStorage.getItem('theme') && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
            function applyTheme(){
                if(isDark){
                    docRoot.classList.add('dark');
                    document.getElementById('app-root').classList.replace('bg-specter-light','bg-specter-dark');
                    themeToggle.innerHTML = SVG.Sun;
                    localStorage.setItem('theme','dark');
                } else {
                    docRoot.classList.remove('dark');
                    document.getElementById('app-root').classList.replace('bg-specter-dark','bg-specter-light');
                    themeToggle.innerHTML = SVG.Moon;
                    localStorage.setItem('theme','light');
                }
            }
            applyTheme();
            themeToggle.addEventListener('click', ()=> { isDark = !isDark; applyTheme(); });

            // demo buttons
            document.querySelectorAll('.demo-btn').forEach(btn=>{
                btn.addEventListener('click', (e)=>{
                    const id = Number(btn.dataset.id);
                    const project = PROJECTS_DATA.find(p=>p.id===id);
                    openProjectModal(project);
                });
            });

            // contact form
            const contactForm = document.getElementById('contact-form');
            initContactForm(contactForm);

            // anchor smooth scroll
            document.querySelectorAll('a[href^="#"]').forEach(a=>{
                a.addEventListener('click', (e)=>{
                    const href = a.getAttribute('href');
                    if(href.length > 1){
                        e.preventDefault();
                        const target = document.querySelector(href);
                        if(target) target.scrollIntoView({behavior:'smooth', block:'start'});
                    }
                });
            });
        }

        // --- initial boot: show preloader then build app ---
        createPreloader(buildApp);
    })();
    </script>
</body>
</html>
